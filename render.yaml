# Render Blueprint: Dashboard → New → Blueprint → выбрать этот репозиторий
services:
  - type: web
    name: music-rating
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --preload: схема БД и сиды создаются один раз до форка воркеров
    startCommand: gunicorn wsgi:app --preload --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: music-rating-db
          property: connectionString
      - key: SITE_NAME
        value: Звукоряд
      - key: SEED_DEMO
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: music-rating-db
    plan: free
    databaseName: music_rating
